  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ot on the rep's phone.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px\">\n        <div class=\"seq\" style=\"animation-delay: 0.0s; border: 1.5px solid #1E3242; background: #0A1A25; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 12px\">\n          <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #0C2633; color: #22D3EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div><div style=\"font-family: 'Sora', sans-serif; font-size: 11px; color: #9FB3C2; letter-spacing: 0.14em\">STEP 1<\u002Fdiv><div style=\"font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; margin-top: 2px\">Call<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"seq\" style=\"animation-delay: 1.2s; border: 1.5px solid #1E3242; background: #0A1A25; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 12px\">\n          <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #0C2633; color: #22D3EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round\"        <h3 class=\"reveal\" style=\"margin: 14px 0 0; font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.08; letter-spacing: -0.03em\">Every call recorded. <span style=\"color: #22D3EE\">On any phone.<\u002Fspan><\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #B8C7D2; max-width: 460px\">Newer Android versions and Google Play rules restrict apps from recording calls on the phone itself. SIM-based call apps work around this with the phone's own recorder or settings that differ by brand, so calls can quietly go unrecorded. FieldScore routes calls through cloud telephony, so every call is captured.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top: 32px; border: 1px solid #1E3242; border-radius: 24px; overflow: hidden; background: #0A1A25\">\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))\">\n            <div style=\"padding: 16px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #9FB3C2\">SIM-BASED CALL APPS<\u002Fdiv>\n            <div style=\"padding: 16px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #22D3EE; background: rgba(34,211,238,0.06)\">FIELDSCORE CLOUD TELEPHONY<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #1E3242\"><div style=\"padding: 14px 18px; font-size: 15px; line-height: 1.5; color: #9FB3C2; display: flex; gap: 10px\"><span style=\"color: #F87171; font-weight: 800\">✕<\u002Fspan><span>Android limits on call recording can leave calls silent or missing<\u002Fspan><\u002Fdiv><div style=\"padding: 14px 18px; font-size: 15px; line-height: 1.5; color: #FFFFFF; display: flex; gap: 10px; background: rgba(34,211,238,0.06)\"><span style=\"color: #22D3EE; font-weight: 80 ; color: #DCE6EC\">Single sign-on and audit logs<\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #22D3EE; font-weight: 800\" aria-label=\"Included\">✓<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display: grid; grid-template-columns: 2.2fr repeat(4, minmax(0, 1fr)); border-top: 1px solid #1E3242; font-size: 14px\"><div style=\"padding: 12px 16px; color: #DCE6EC\">Dedicated success manager<\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #3E5A70\" aria-label=\"Not included\">—<\u002Fspan><\u002Fdiv><div style=\"padding: 12px 10px; text-align: center; color: #C3D0DA\"><span style=\"color: #22D3EE; font-weight: 800\" aria-label=\"Included\">✓<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"padding: 110px 0; background: #F4F6F7; color: #0B1A26\">\n    <div class=\"wrap\">\n      <div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; color: #0E7490\">FAQ<\u002Fdiv>\n      <h2 class=\"reveal\" style=\"margin: 16px 0 0; font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(34px, 4.4vw, 56px); line-height: 1.03; letter-spacing: -0.035em\">Questions teams ask.<\u002Fh2>\n      <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 12px\">\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Do we need any extra hardware?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">No. Calls are captured in the app over cloud telephony, using the phones your team already carries. No recorders, no new devices.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Do we need a device to record meetings?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">No. The Live Meeting Recorder is built into the FieldScore app. Your rep taps record on their phone, and Auto AI Summary adds the notes, action items and follow-ups to the lead.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">How does the accident alert work?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">The rep presses and holds the SOS button in the app. FieldScore alerts their company and family with live location, and the alert screen gives one-tap calls to 112, police (100) and ambulance (108).<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Does FieldScore replace our CRM?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">No. FieldScore is the execution layer. It captures what happens in the field and syncs it into Salesforce, HubSpot or Zoho.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Why cloud telephony instead of SIM-based calling?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Newer Android versions and Google Play rules restrict apps from recording calls on the phone, and SIM-based apps behave differently across phone brands. Cloud telephony records every call in the cloud, on any phone, so nothing goes missing and the data stays with your company.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">How are calls recorded and summarised?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Every inbound and outbound call is logged with its duration and recording. AI transcribes it, writes a short note on the lead and creates the follow-up tasks.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">How are site visits verified?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">With GPS check-in and check-out at the site. Every visit is time-stamped and added to the lead's timeline with location and notes.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Does it track attendance?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Yes. Your team checks in and out from the app, and every working session is logged so managers can see who is working, live.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Is there a web version?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Yes. Your field team uses the mobile app, and managers and admins get a full web application for dashboards, reports and team management.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Which industries is it for?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Any team that sells in the field: real estate, pharma, insurance, banking and loans, FMCG, home services and more.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Can it be customised for our process?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Yes. The enterprise edition is customised to your industry, your sales process and your team.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">Who in the team uses it?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Salespeople, sales managers and owners each get a view built for their role, all in one app.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FFFFFF\"><summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px\">How much does FieldScore cost?<span class=\"chev\" aria-hidden=\"true\" style=\"color: #0E7490; font-size: 26px; font-weight: 400\">+<\u002Fspan><\u002Fsummary><div style=\"font-size: 15px; line-height: 1.6; color: #3D4D59; padding-bottom: 20px\">Plans start at ₹899 per user per month billed yearly, with calling minutes included. See the pricing section for Starter, Median, Pro and Ultima.<\u002Fdiv><\u002Fdetails>\n        <details class=\"reveal\" style=\"border: 1.5px solid #D5DDE2; border-radius: 18px; padding: 0 22px; background: #FF
